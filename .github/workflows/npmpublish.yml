# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages
name: Node.js Package
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write    # Required for OIDC trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: "${{ secrets.COVERALLS_REPO_TOKEN }}"
      COVERALLS_GIT_BRANCH: "${{ github.ref }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn install
      - run: yarn run build
      - run: yarn run test
      - run: yarn run coverageci

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Update npm
        run: npm install -g npm@latest
      - run: yarn install
        env:
          # actions/setup-node's registry-url input writes a .npmrc
          # containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          # We publish via OIDC trusted publishing (no NODE_AUTH_TOKEN secret),
          # but unlike npm, yarn classic errors if it can't resolve any ${VAR}
          # in .npmrc, even an unused one. This placeholder only satisfies
          # that substitution for install/build - the actual publish step
          # below is left untouched so OIDC auth applies there.
          NODE_AUTH_TOKEN: unused-yarn-npmrc-placeholder
      - run: yarn build
        env:
          NODE_AUTH_TOKEN: unused-yarn-npmrc-placeholder
      - run: npm publish --provenance
